name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          python -m pip install --upgrade pip
          pip install flask==2.2.3 werkzeug==2.2.3 flask-cors==3.0.10 pytest flake8

      - name: Run tests
        working-directory: starter/backend
        run: pytest -v

      - name: Run lint
        working-directory: starter/backend
        run: flake8

  docker:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: starter/backend
        run: docker build -t vivekv27/movie-backend:latest .

      - name: Push Docker image
        run: docker push vivekv27/movie-backend:latest